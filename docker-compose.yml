x-koala-app: &koala-app
  image: koala-cards-app:dev
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  working_dir: /app
  entrypoint: ./entrypoint.sh
  env_file:
    - .env
  environment:
    POSTGRES_URI: postgres://prisma:your_password@db:5432/prisma
  init: true
  logging: &bounded-logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - koala-network

services:
  app:
    <<: *koala-app
    command: npm run dev
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
      - npm-cache:/root/.npm
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *koala-app
    command: npm run worker
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - npm-cache:/root/.npm
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    <<: *koala-app
    command: npm run db:migrate:deploy
    restart: "no"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - npm-cache:/root/.npm
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: prisma
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - koala-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *bounded-logs

volumes:
  db-data:
  next-cache:
  node-modules:
  npm-cache:

networks:
  koala-network:
    driver: bridge
